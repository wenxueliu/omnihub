[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnihub"
version = "0.1.0"
description = "Config-driven, platform-centric internet access for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "omnihub contributors" }]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
omnihub = "omnihub.cli:main"
xiaohongshu-cli = "omnihub.platforms.xiaohongshu.xiaohongshu_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["omnihub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
