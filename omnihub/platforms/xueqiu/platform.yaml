id: xueqiu
description: Xueqiu stock discussion search and status reads through the logged-in browser.
version: 1
level: optional
priority: 160
capabilities: [browser]

check:
  search: {query: "茅台", limit: 2}
  read:
    target: "https://xueqiu.com/8145533877/261268392"

domains:
  - xueqiu.com
  - www.xueqiu.com

requires:
  adapters: []

actions:
  search:
    params:
      query:
        type: str
        required: true
        description: Keywords to search Xueqiu for.
      limit:
        type: int
        default: 5
        minimum: 1
        maximum: 20
        description: Maximum number of timeline items.
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/search.js
        args:
          url: "https://xueqiu.com/k?q=${query|urlencode}"
          wait_for: ".timeline__item"
          wait_ms: 15000
          limit: "${limit}"
          new_tab: false
          group_title: "omnihub: xueqiu search"
        parse:
          - json_items
        priority: 10
        timeout: 60
        min_interval: 2

  read:
    params:
      target:
        type: str
        format: url
        required: true
        description: Xueqiu status URL.
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/read.js
        args:
          url: "${target}"
          wait_for: "h1"
          wait_ms: 15000
          limit: 1
          new_tab: false
          group_title: "omnihub: xueqiu read"
        parse:
          - daemon_page
        priority: 10
        timeout: 60
        min_interval: 2
