id: bilibili
description: Bilibili video search and subtitle reads through the user's logged-in browser.
version: 2
level: default
priority: 110
capabilities: [http, browser]

check:
  search: {query: "python", limit: 1}
  read: {target: "https://www.bilibili.com/video/BV1S1dPBYEG9"}

domains:
  - bilibili.com
  - www.bilibili.com
  - m.bilibili.com
  - b23.tv

requires:
  adapters: [http]

actions:
  search:
    params:
      query:
        type: str
        required: true
        description: Keywords to search Bilibili videos for.
      limit:
        type: int
        default: 5
        minimum: 1
        maximum: 20
        description: Maximum number of results.
    sources:
      - adapter: http
        name: exa
        method: POST
        url: https://mcp.exa.ai/mcp
        headers:
          Content-Type: application/json
          Accept: application/json, text/event-stream
        body:
          jsonrpc: "2.0"
          id: 1
          method: tools/call
          params:
            name: web_search_exa
            arguments:
              query: "site:bilibili.com ${query}"
              objective: "${query}"
              numResults: "${limit}"
        parse:
          - exa_search
        priority: 10
        timeout: 30

  read:
    params:
      target:
        type: str
        format: url
        required: true
        description: Bilibili video URL (b23.tv short links are accepted).
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        args:
          url: "${target}"
          wait_ms: 10000
          new_tab: false
          group_title: "omnihub: bilibili subtitles"
          code: |
            (async () => {
              let loggedIn = false;
              try {
                const nav = await fetch(
                  'https://api.bilibili.com/x/web-interface/nav',
                  {credentials: 'include'}
                ).then(response => response.json());
                loggedIn = !!(nav.data && nav.data.isLogin);
              } catch (error) {
                return JSON.stringify({error: 'cannot verify the Bilibili login: ' + error});
              }
              if (!loggedIn) {
                return JSON.stringify({
                  login: true,
                  message: 'Bilibili subtitle reads need a logged-in browser session'
                });
              }

              const state = window.__INITIAL_STATE__ || {};
              const video = state.videoData || {};
              let cid = video.cid || null;
              let bvid = video.bvid || null;
              let title = video.title || null;
              let owner = video.owner && video.owner.name ? video.owner.name : null;
              let pubdate = video.pubdate || null;
              let duration = video.duration || null;

              if (!cid) {
                const match = (location.pathname || '').match(/\/video\/(BV[0-9A-Za-z]{10})/);
                bvid = bvid || (match ? match[1] : null);
                if (!bvid) {
                  return JSON.stringify({
                    not_found: true,
                    message: 'not a Bilibili video page'
                  });
                }
                const view = await fetch(
                  'https://api.bilibili.com/x/web-interface/view?bvid=' + bvid,
                  {credentials: 'include'}
                ).then(response => response.json());
                if (view.code === -404) {
                  return JSON.stringify({
                    not_found: true,
                    message: 'Bilibili video ' + bvid + ' does not exist'
                  });
                }
                if (view.code !== 0 || !view.data) {
                  return JSON.stringify({
                    error: 'Bilibili view API ' + view.code + ': ' + (view.message || 'unknown error')
                  });
                }
                cid = view.data.cid;
                bvid = view.data.bvid || bvid;
                title = view.data.title || title;
                owner = view.data.owner ? view.data.owner.name : owner;
                pubdate = view.data.pubdate || pubdate;
                duration = view.data.duration || duration;
              }
              if (!cid) {
                return JSON.stringify({
                  not_found: true,
                  message: 'cannot resolve the video cid'
                });
              }

              // player/v2 is answered from a cache pool that hands back a
              // different slice of the track list on every call. The slice
              // mixes in AI tracks of unrelated videos, and the video's own
              // track only shows up in some responses, so sample the endpoint
              // in parallel and keep every unique track. The parser then
              // picks the track whose cues cover the video duration.
              const requests = [];
              for (let attempt = 0; attempt < 10; attempt++) {
                requests.push(
                  fetch(
                    'https://api.bilibili.com/x/player/v2?cid=' + cid +
                      '&bvid=' + bvid + '&t=' + (Date.now() + attempt),
                    {credentials: 'include'}
                  )
                    .then(response => response.json())
                    .then(info => {
                      if (info.code !== 0 || !info.data || !info.data.subtitle) {
                        return [];
                      }
                      return info.data.subtitle.subtitles || [];
                    })
                    .catch(() => [])
                );
              }
              const batches = await Promise.all(requests);

              const seen = {};
              const tracks = [];
              let listed = 0;
              for (const batch of batches) {
                listed = Math.max(listed, batch.length);
                for (const track of batch) {
                  if (!track.subtitle_url) continue;
                  const id = String(track.id_str || track.subtitle_url);
                  if (seen[id]) continue;
                  seen[id] = true;
                  tracks.push(track);
                }
              }

              return JSON.stringify({
                title: title,
                owner: owner,
                pubdate: pubdate,
                duration: duration,
                bvid: bvid,
                cid: cid,
                page: location.href,
                track_count: Math.max(listed, tracks.length),
                subtitles: tracks.map(track => ({
                  lan: track.lan,
                  lan_doc: track.lan_doc,
                  url: track.subtitle_url
                }))
              });
            })()
        parse:
          - subtitles
        priority: 10
        timeout: 90
        min_interval: 2
