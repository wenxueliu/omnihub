id: bilibili
description: Bilibili video search through the public API and subtitle reads through the user's logged-in browser.
version: 3
level: default
priority: 110
capabilities: [http, browser]

check:
  search: {query: "python", limit: 1}
  read: {target: "https://www.bilibili.com/video/BV1S1dPBYEG9"}

domains:
  - bilibili.com
  - www.bilibili.com
  - m.bilibili.com
  - b23.tv

requires:
  adapters: [http, builtin]

parse_script: scripts/parse.py

actions:
  search:
    params:
      query:
        type: str
        required: true
        description: Keywords to search Bilibili videos for.
      limit:
        type: int
        default: 5
        minimum: 1
        maximum: 20
        description: Maximum number of results.
    sources:
      - adapter: builtin
        name: bilibili-api
        call: search
        script: scripts/search.py
        priority: 5
        timeout: 20
        min_interval: 2
      - adapter: http
        name: exa
        method: POST
        url: https://mcp.exa.ai/mcp
        headers:
          Content-Type: application/json
          Accept: application/json, text/event-stream
        body:
          jsonrpc: "2.0"
          id: 1
          method: tools/call
          params:
            name: web_search_exa
            arguments:
              query: "site:bilibili.com ${query}"
              objective: "${query}"
              numResults: "${limit}"
        parse:
          - exa_search
        priority: 10
        timeout: 30

  read:
    params:
      target:
        type: str
        format: url
        required: true
        description: Bilibili video URL (b23.tv short links are accepted).
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/read.js
        args:
          url: "${target}"
          wait_ms: 10000
          new_tab: false
          group_title: "omnihub: bilibili subtitles"
        parse:
          - subtitles
        priority: 10
        timeout: 90
        min_interval: 2
