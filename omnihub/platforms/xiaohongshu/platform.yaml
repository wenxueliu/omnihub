id: xiaohongshu
description: Xiaohongshu note search and reads through the logged-in browser.
version: 1
level: optional
priority: 170
capabilities: [browser]

check:
  # Reads need the xsec_token that a search result carries; that token is
  # short-lived, so a static read check would fail for an environmental reason.
  search: {query: "咖啡", limit: 2}

domains:
  - xiaohongshu.com
  - www.xiaohongshu.com
  - xhslink.com
  - www.xhslink.com

requires:
  adapters: []

actions:
  search:
    params:
      query:
        type: str
        required: true
        description: Keywords to search Xiaohongshu notes for.
      limit:
        type: int
        default: 5
        minimum: 1
        maximum: 20
        description: Maximum number of notes.
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/search.js
        args:
          url: "https://www.xiaohongshu.com/search_result?keyword=${query|urlencode}&source=web_search_result_notes"
          wait_for: "section.note-item"
          wait_ms: 15000
          limit: "${limit}"
          new_tab: false
          group_title: "omnihub: xiaohongshu search"
          login_url:
            - "/login"
        parse:
          - json_items
        priority: 10
        timeout: 60
        min_interval: 2

  read:
    params:
      target:
        type: str
        format: url
        required: true
        description: Note URL, including the xsec_token query parameter.
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/read.js
        args:
          url: "${target}"
          wait_for: "#detail-title, .note-content"
          wait_ms: 15000
          limit: 1
          new_tab: false
          group_title: "omnihub: xiaohongshu read"
          login_url:
            - "/login"
        parse:
          - daemon_page
        priority: 10
        timeout: 60
        min_interval: 2
