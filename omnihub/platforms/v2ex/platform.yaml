id: v2ex
description: V2EX topic search (SOV2EX) and topic reads with replies.
version: 1
level: default
priority: 120
capabilities: [http]

check:
  search: {query: "python", limit: 1}
  read: {target: "https://www.v2ex.com/t/1"}

domains:
  - v2ex.com
  - www.v2ex.com
  - sov2ex.com
  - www.sov2ex.com

requires:
  adapters: [http, builtin]

parse_script: scripts/parse.py

actions:
  search:
    params:
      query:
        type: str
        required: true
        description: Keywords to search V2EX topics for.
      limit:
        type: int
        default: 5
        minimum: 1
        maximum: 50
        description: Maximum number of topics.
    sources:
      - adapter: http
        name: sov2ex
        url: https://www.sov2ex.com/api/search?q=${query|urlencode}&size=${limit}&from=0&sort=created
        headers:
          Accept: application/json
          User-Agent: omnihub/0.1
        parse:
          - v2ex_search
        priority: 10
        timeout: 20
      - adapter: http
        name: exa
        method: POST
        url: https://mcp.exa.ai/mcp
        headers:
          Content-Type: application/json
          Accept: application/json, text/event-stream
        body:
          jsonrpc: "2.0"
          id: 1
          method: tools/call
          params:
            name: web_search_exa
            arguments:
              query: "site:v2ex.com ${query}"
              objective: "${query}"
              numResults: "${limit}"
        parse:
          - exa_search
        priority: 20
        timeout: 30

  read:
    params:
      target:
        type: str
        required: true
        description: V2EX topic URL or numeric topic id.
    sources:
      - adapter: builtin
        name: v2ex-api
        call: read_topic
        script: scripts/read.py
        parse:
          - json_items
        priority: 10
        timeout: 25
