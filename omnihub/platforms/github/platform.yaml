id: github
description: GitHub repository search and repository / issue / pull-request reads.
version: 1
level: default
priority: 100
capabilities: [http]

check:
  search: {query: "flask", limit: 1}
  read: {target: "https://github.com/pallets/flask"}

domains:
  - github.com
  - api.github.com
  - raw.githubusercontent.com

requires:
  adapters: [http, builtin]

auth:
  secret: GITHUB_TOKEN
  login_url: https://github.com/settings/tokens

actions:
  search:
    params:
      query:
        type: str
        required: true
        description: Repository search query; GitHub qualifiers are allowed.
      limit:
        type: int
        default: 5
        minimum: 1
        maximum: 100
        description: Maximum number of repositories.
    sources:
      - adapter: http
        name: github-gh-token
        when: secret:GH_TOKEN
        url: https://api.github.com/search/repositories?q=${query|urlencode}&per_page=${limit}
        headers:
          Accept: application/vnd.github+json
          User-Agent: omnihub/0.1
          X-GitHub-Api-Version: "2022-11-28"
          Authorization: Bearer ${secret:GH_TOKEN}
        parse:
          - github_repos
        priority: 10
        timeout: 20
      - adapter: http
        name: github-token
        when: secret:GITHUB_TOKEN
        url: https://api.github.com/search/repositories?q=${query|urlencode}&per_page=${limit}
        headers:
          Accept: application/vnd.github+json
          User-Agent: omnihub/0.1
          X-GitHub-Api-Version: "2022-11-28"
          Authorization: Bearer ${secret:GITHUB_TOKEN}
        parse:
          - github_repos
        priority: 11
        timeout: 20
      - adapter: http
        name: github-api
        url: https://api.github.com/search/repositories?q=${query|urlencode}&per_page=${limit}
        headers:
          Accept: application/vnd.github+json
          User-Agent: omnihub/0.1
          X-GitHub-Api-Version: "2022-11-28"
        parse:
          - github_repos
        priority: 20
        timeout: 20

  read:
    params:
      target:
        type: str
        required: true
        description: GitHub URL or owner/repo, optionally with /issues/<n> or /pull/<n>.
    sources:
      - adapter: builtin
        name: github-api
        call: read
        parse:
          - json_items
        priority: 10
        timeout: 25
