id: linkedin
description: LinkedIn job search and job posting reads through the public guest API in the browser.
version: 1
level: optional
priority: 190
capabilities: [browser]

check:
  search: {query: "python", limit: 2}
  read:
    target: "https://www.linkedin.com/jobs/view/4379639599/"

domains:
  - linkedin.com
  - www.linkedin.com

requires:
  adapters: []

actions:
  search:
    params:
      query:
        type: str
        required: true
        description: Job keywords.
      location:
        type: str
        default: ""
        description: Optional job location filter.
      limit:
        type: int
        default: 10
        minimum: 1
        maximum: 25
        description: Maximum number of jobs.
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/search.js
        args:
          url: "https://www.linkedin.com/jobs/search/?keywords=${query|urlencode}&location=${location|urlencode}"
          wait_for: "body"
          wait_ms: 10000
          limit: "${limit}"
          new_tab: false
          group_title: "omnihub: linkedin search"
          login_url:
            - "/authwall"
            - "/login"
        parse:
          - json_items
        priority: 10
        timeout: 60
        min_interval: 3

  read:
    params:
      target:
        type: str
        format: url
        required: true
        description: LinkedIn job posting URL containing the numeric job id.
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/read.js
        args:
          url: "${target}"
          wait_for: "body"
          wait_ms: 10000
          limit: 1
          new_tab: false
          group_title: "omnihub: linkedin read"
          login_url:
            - "/authwall"
            - "/login"
        parse:
          - daemon_page
        priority: 10
        timeout: 60
        min_interval: 3
