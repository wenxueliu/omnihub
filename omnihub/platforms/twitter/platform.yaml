id: twitter
description: Twitter/X search and thread reads through the user's logged-in browser.
version: 1
level: optional
priority: 150
capabilities: [browser]

check:
  search: {query: "openai", limit: 2}
  read:
    target: "https://x.com/HandToForehead/status/2114297993222660242"

domains:
  - x.com
  - www.x.com
  - twitter.com
  - www.twitter.com
  - mobile.twitter.com

requires:
  adapters: [http]

actions:
  search:
    params:
      query:
        type: str
        required: true
        description: Keywords to search X for.
      limit:
        type: int
        default: 5
        minimum: 1
        maximum: 20
        description: Maximum number of tweets.
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/search.js
        args:
          url: "https://x.com/search?q=${query|urlencode}&f=live"
          wait_for: "article"
          wait_ms: 15000
          limit: "${limit}"
          new_tab: false
          group_title: "omnihub: twitter search"
          login_url:
            - "/i/flow/login"
        parse:
          - json_items
        priority: 10
        timeout: 60
        min_interval: 2
      - adapter: http
        name: exa
        method: POST
        url: https://mcp.exa.ai/mcp
        headers:
          Content-Type: application/json
          Accept: application/json, text/event-stream
        body:
          jsonrpc: "2.0"
          id: 1
          method: tools/call
          params:
            name: web_search_exa
            arguments:
              query: "site:x.com ${query}"
              objective: "${query}"
              numResults: "${limit}"
        parse:
          - exa_search
        priority: 20
        timeout: 30

  read:
    params:
      target:
        type: str
        format: url
        required: true
        description: Tweet URL on x.com or twitter.com.
    sources:
      - adapter: daemon
        name: kimi-browser
        when: adapter:daemon
        call: browse
        script: scripts/read.js
        args:
          url: "${target}"
          wait_for: "article"
          wait_ms: 15000
          limit: 1
          new_tab: false
          group_title: "omnihub: twitter read"
          login_url:
            - "/i/flow/login"
        parse:
          - daemon_page
        priority: 10
        timeout: 60
        min_interval: 2
